<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L-SENTRY</title>
<?!= include('Estilos'); ?>
</head>
<body class="bg-900">

<!-- ══════════════════════════════════════════════
     PANTALLA DE LOGIN
══════════════════════════════════════════════ -->
<div id="screen-login" class="screen active">
  <div class="login-bg">
    <div class="login-glow"></div>
  </div>
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
      <div>
        <div class="logo-text">L-<span>SENTRY</span></div>
        <div class="logo-sub">Sistema de Administración de Seguridad</div>
      </div>
    </div>

    <div id="login-error" class="alert-error" style="display:none"></div>

    <div class="form-group">
      <label class="form-label">Usuario</label>
      <div class="input-icon-wrap">
        <i class="fas fa-user"></i>
        <input id="inp-usuario" class="form-input" type="text"
               placeholder="Tu nombre de usuario"
               onkeydown="if(event.key==='Enter') doLogin()">
      </div>
    </div>
    <div class="form-group" style="margin-top:14px">
      <label class="form-label">Contraseña</label>
      <div class="input-icon-wrap">
        <i class="fas fa-lock"></i>
        <input id="inp-password" class="form-input" type="password"
               placeholder="••••••••"
               onkeydown="if(event.key==='Enter') doLogin()">
        <i class="fas fa-eye toggle-pass" onclick="togglePass()" id="eye-icon"></i>
      </div>
    </div>

    <button id="btn-login" class="btn btn-primary login-btn" onclick="doLogin()">
      <span id="btn-login-text"><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</span>
      <span id="btn-login-loading" style="display:none"><i class="fas fa-spinner fa-spin"></i> Verificando...</span>
    </button>

    <div class="login-footer">
      <i class="fas fa-shield-check"></i> Conexión segura · L-SENTRY v2.0
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     APP PRINCIPAL (se muestra tras login)
══════════════════════════════════════════════ -->
<div id="screen-app" class="screen" style="display:none; flex-direction:column; height:100vh">

  <!-- TOPBAR -->
  <div id="topbar">
    <div class="logo-mark">
      <div class="logo-icon sm"><i class="fas fa-shield-alt"></i></div>
      <div class="logo-text sm">L-<span>SENTRY</span></div>
    </div>
    <div class="topbar-search">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Buscar..." id="global-search" oninput="globalSearch(this.value)">
    </div>
    <div class="topbar-actions">
      <!-- Badge solicitudes pendientes (visible para Admin y Seguridad Vial) -->
      <div id="btn-solicitudes-badge" class="icon-btn" onclick="showPage('solicitudes')" style="display:none" title="Solicitudes Pendientes">
        <i class="fas fa-bell"></i>
        <div class="notif-dot" id="notif-count"></div>
      </div>
      <div class="icon-btn" onclick="sincronizar()" title="Sincronizar datos">
        <i class="fas fa-sync-alt" id="sync-icon"></i>
      </div>
      <div class="user-chip" onclick="toggleUserMenu()">
        <div class="user-avatar" id="user-avatar-top">?</div>
        <div>
          <div class="user-name" id="user-name-top">—</div>
          <div class="user-rol"  id="user-rol-top">—</div>
        </div>
        <i class="fas fa-chevron-down" style="font-size:9px;color:var(--text-muted)"></i>
      </div>
    </div>
  </div>

  <!-- LAYOUT -->
  <div style="display:flex;flex:1;overflow:hidden">

    <!-- SIDEBAR -->
    <nav id="sidebar">
      <div id="nav-menu"></div>
      <div class="sidebar-footer">
        <div class="nav-item danger" onclick="doLogout()">
          <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
        </div>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main id="main-content">
      <!-- Las páginas se inyectan aquí dinámicamente -->
      <div id="page-loader" style="display:none" class="page-loader">
        <i class="fas fa-circle-notch fa-spin"></i>
      </div>
      <div id="pages-container"></div>
    </main>

  </div>
</div>

<!-- ══ TOAST NOTIFICATIONS ══ -->
<div id="toast-container"></div>

<!-- ══ MODAL CONTAINER ══ -->
<div id="modal-overlay" class="modal-overlay" onclick="closeModal()" style="display:none">
  <div id="modal-box" class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Modal</div>
      <button class="icon-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div id="modal-body"></div>
    <div id="modal-footer" class="modal-footer"></div>
  </div>
</div>

<?!= include('Scripts'); ?>
</body>
</html>
